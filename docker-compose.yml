services:
  mysql:
    image: mysql:9.5
    container_name: weathercrash-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: security101
      MYSQL_DATABASE: weathercrash
    ports:
      - "3306:3306"
      - "33060:33060"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/my.cnf:/etc/mysql/conf.d/custom.cnf:ro
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
      - ./data:/data:ro
    command:
      - --local-infile=1
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-psecurity101"]
      interval: 10s
      timeout: 5s
      retries: 10

  metabase:
    image: metabase/metabase:latest
    container_name: weathercrash-metabase
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      MB_DB_TYPE: h2
      MB_DB_FILE: /metabase-data/metabase.db
    volumes:
      - metabase-data:/metabase-data
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data:
  metabase-data:
